version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shortsforge-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://shortsforge:forge_secret_2026@postgres:5432/shortsforge_db
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - YOUTUBE_DATA_API_KEY=${YOUTUBE_DATA_API_KEY}
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shortsforge-worker
    command: ["node", "dist/queue/worker.js"]
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://shortsforge:forge_secret_2026@postgres:5432/shortsforge_db
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: shortsforge-postgres
    restart: always
    environment:
      POSTGRES_USER: shortsforge
      POSTGRES_PASSWORD: forge_secret_2026
      POSTGRES_DB: shortsforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: shortsforge-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
